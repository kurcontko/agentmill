sonar.organization=kurcontko
sonar.projectKey=kurcontko_agentmill

sonar.sources=.
sonar.inclusions=**/*.sh,**/*.py,**/*.yml,**/*.yaml,Dockerfile
sonar.exclusions=**/node_modules/**,**/logs/**,**/.git/**,**/repo/**
sonar.coverage.exclusions=tests/**

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# Reviewed trust-boundary false positives; keep every other rule active.
# CLI files are explicitly caller-selected inputs to an unprivileged local process.
# Check log paths originate in supervisor ProcessOutput, never worker replies.
# Display-only shlex.join does not execute commands; the CLI regression executes
# its quoted instruction with a hostile filename. Reassess if these boundaries change.
sonar.issue.ignore.multicriteria=cliExplicitFiles,cliMission,checkLogPaths,checkLogMetadata,displayCommand
sonar.issue.ignore.multicriteria.cliExplicitFiles.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.cliExplicitFiles.resourceKey=agentmill/cli.py
sonar.issue.ignore.multicriteria.cliMission.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.cliMission.resourceKey=agentmill/cli.py
sonar.issue.ignore.multicriteria.checkLogPaths.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.checkLogPaths.resourceKey=agentmill/checks.py
sonar.issue.ignore.multicriteria.checkLogMetadata.ruleKey=pythonsecurity:S6549
sonar.issue.ignore.multicriteria.checkLogMetadata.resourceKey=agentmill/checks.py
sonar.issue.ignore.multicriteria.displayCommand.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.displayCommand.resourceKey=agentmill/cli.py

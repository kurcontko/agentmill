name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run ShellCheck
        run: shellcheck loop.sh mill reviewer_exec.sh dind_watch.sh tests/*.sh

  shell-tests:
    name: Shell Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run loop smoke tests
        run: bash tests/test_loop.sh

      - name: Run mill smoke tests
        run: bash tests/test_mill.sh

      - name: Run Landlock confinement tests
        run: python3 tests/test_landlock.py

      - name: Compile Python helpers
        run: python3 -m compileall -q landlock_exec.py reviewer_control.py supervisor.py reviewer_rpc.py tests

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [shellcheck, shell-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: agentmill:ci
          # GID 20 is `dialout` in node:22 Alpine. Building with it exercises the
          # Linux path where the requested host GID already has another name.
          build-args: |
            AGENT_UID=12345
            AGENT_GID=20
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify packaged reviewer boundary and Linux ownership
        run: |
          docker run --rm --init --pids-limit 512 \
            --security-opt no-new-privileges --cap-drop ALL \
            --cap-add SETUID --cap-add SETGID --cap-add KILL \
            -e LANDLOCK_EXEC=/usr/local/bin/landlock-exec \
            -e LANDLOCK_RUN_AS=agentmill-reviewer \
            -e EXPECTED_AGENT_UID=12345 \
            -e EXPECTED_AGENT_GID=20 \
            -v "$GITHUB_WORKSPACE/tests/test_landlock.py:/test_landlock.py:ro" \
            agentmill:ci python3 /test_landlock.py

          docker run --rm --init --pids-limit 512 \
            --security-opt no-new-privileges --cap-drop ALL \
            --cap-add SETUID --cap-add SETGID --cap-add KILL \
            -v "$GITHUB_WORKSPACE/tests/test_image_evaluator.sh:/test_image_evaluator.sh:ro" \
            agentmill:ci bash /test_image_evaluator.sh

          docker run --rm --init --pids-limit 512 \
            --security-opt no-new-privileges --cap-drop ALL \
            --cap-add SETUID --cap-add SETGID --cap-add KILL agentmill:ci bash -ceu '
            for cli in claude codex; do
              scratch="$(mktemp -d /tmp/agentmill-cli-smoke.XXXXXX)"
              mkdir -p "$scratch"/{.claude,.codex,cache,config,data,state}
              chmod -R a+rwX "$scratch"
              cli_path="$(command -v "$cli")"
              /usr/bin/timeout --kill-after=1 10 \
                /usr/local/bin/agentmill-reviewer-exec \
                --write-root "$scratch" --allow-device /dev/null --max-processes 448 -- \
                /usr/bin/env -i \
                HOME="$scratch" TMPDIR="$scratch" TMP="$scratch" TEMP="$scratch" \
                PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 \
                XDG_CACHE_HOME="$scratch/cache" XDG_CONFIG_HOME="$scratch/config" \
                XDG_DATA_HOME="$scratch/data" XDG_STATE_HOME="$scratch/state" \
                CODEX_HOME="$scratch/.codex" CLAUDE_CONFIG_DIR="$scratch/.claude" \
                "$cli_path" --version
            done
          '

      - name: Verify concurrent DinD isolation and lifecycle
        run: bash tests/test_dind.sh

      - name: Verify supervisor RPC and independent deadline
        run: |
          docker run --rm --init --pids-limit 512 \
            --security-opt no-new-privileges --cap-drop ALL \
            --cap-add SETUID --cap-add SETGID --cap-add KILL \
            -e ITER_TIMEOUT=1 -e SHUTDOWN_GRACE=1 \
            -v "$GITHUB_WORKSPACE/tests/test_supervisor.sh:/test_supervisor.sh:ro" \
            agentmill:ci bash /test_supervisor.sh

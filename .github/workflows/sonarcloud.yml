name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "split/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Measure basic-loop coverage
        env:
          AGENTMILL_TEST_COVERAGE: "1"
        run: |
          python3 -m venv "$RUNNER_TEMP/agentmill-coverage"
          coverage_python="$RUNNER_TEMP/agentmill-coverage/bin/python"
          "$coverage_python" -m pip install coverage==7.16.1
          "$coverage_python" -m unittest discover -s tests -p 'test_basic_loop.py'
          "$coverage_python" -m coverage combine
          "$coverage_python" -m coverage xml --fail-under=80

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmill"
dynamic = ["version"]
description = "Run codex exec or claude -p on one task in a private checkout, check the result in a clean container, and get a verdict scripts can act on"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michal Kurc" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["coding-agent", "claude-code", "codex", "docker", "ci", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/kurcontko/agentmill"
Documentation = "https://github.com/kurcontko/agentmill/blob/main/docs/runner-reference.md"
Issues = "https://github.com/kurcontko/agentmill/issues"
Changelog = "https://github.com/kurcontko/agentmill/blob/main/CHANGELOG.md"

[project.scripts]
agentmill = "agentmill.cli:main"

[tool.setuptools.dynamic]
version = { attr = "agentmill.__version__" }

[tool.setuptools.packages.find]
include = ["agentmill*"]

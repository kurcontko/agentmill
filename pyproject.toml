[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmill"
version = "0.1.0"
description = "A bounded, checked job runner for native coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mill = "agentmill.cli:main"

[tool.setuptools.packages.find]
include = ["agentmill*"]
